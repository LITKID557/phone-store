<!DOCTYPE html>
<html>
<head>
<title>Phone Store App</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
padding-bottom:60px;
}

/* TOP BAR */
header{
background:#111;
color:white;
text-align:center;
padding:15px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:10px;
padding:10px;
}

.card{
background:white;
border-radius:12px;
padding:8px;
position:relative;
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:10px;
}

.price{
color:green;
font-weight:bold;
}

/* BUTTONS */
button{
width:100%;
padding:8px;
border:none;
border-radius:8px;
background:#25D366;
color:white;
margin-top:5px;
cursor:pointer;
}

.icon{
position:absolute;
top:8px;
right:8px;
cursor:pointer;
font-size:18px;
}

/* BOTTOM NAV */
.nav{
position:fixed;
bottom:0;
left:0;
width:100%;
background:#111;
display:flex;
justify-content:space-around;
padding:10px;
color:white;
}

.nav div{
cursor:pointer;
font-size:12px;
text-align:center;
}

/* SECTIONS */
.section{display:none;}
.active{display:block;}
  .whatsapp-float{
position:fixed;
bottom:15px;
right:15px;
background:#25D366;
color:white;
padding:12px 15px;
border-radius:50px;
font-size:14px;
text-decoration:none;
box-shadow:0 0 10px rgba(0,0,0,0.2);
z-index:999;
}

.badge{
background:#111;
color:white;
display:inline-block;
padding:5px 8px;
font-size:10px;
border-radius:5px;
margin-bottom:5px;
}
</style>
</head>

<body>

<header>
<h2>🛒 Shop Phones</h2>
</header>

<div style="text-align:center;margin:10px;">
<button onclick="filter('all')">All</button>
<button onclick="filter('Apple')">iPhone</button>
<button onclick="filter('Samsung')">Samsung</button>
<button onclick="filter('Tecno')">Tecno</button>
<button onclick="filter('Infinix')">Infinix</button>
<button onclick="filter('Google')">Google</button>
</div>

<div class="grid" id="list"></div>
<!-- CART -->
<div id="cart" class="section">
<h3 style="text-align:center;">🛒 Cart</h3>
<div id="cartList"></div>
</div>

<!-- WISHLIST -->
<div id="wish" class="section">
<h3 style="text-align:center;">❤️ Wishlist</h3>
<div id="wishList"></div>
</div>

<!-- NAV -->
<div class="nav">
<div onclick="show('shop')">🏠<br>Shop</div>
<div onclick="show('cart')">🛒<br>Cart</div>
<div onclick="show('wish')">❤️<br>Wishlist</div>
</div>

<script>

let phones = [
{ id:"iphonex", name:"iPhone X", brand:"Apple", price:"K3500" },
{ id:"samsunga32", name:"Samsung A32", brand:"Samsung", price:"K2300" },
{ id:"googlepixel7", name:"Google Pixel 7", brand:"Google", price:"K4500" },
{ id:"tecnopop7", name:"Tecno Pop 7", brand:"Tecno", price:"K900" },
{ id:"itela05s", name:"Itel A05s", brand:"Itel", price:"K800" },
{ id:"iphone11pro", name:"iPhone 11 Pro", brand:"Apple", price:"K5200" },
{ id:"iphone7plus", name:"iPhone 7 Plus", brand:"Apple", price:"K1800" },
{ id:"googlepixel2xl", name:"Google Pixel 2 XL", brand:"Google", price:"K1500" },
{ id:"iphone17pro", name:"iPhone 17 Pro", brand:"Apple", price:"K15000" },
{ id:"tecnocamon50", name:"Tecno Camon 50", brand:"Tecno", price:"K3000" },
{ id:"tecnopop20", name:"Tecno Pop 20", brand:"Tecno", price:"K1200" },
{ id:"infinixhot60i", name:"Infinix Hot 60i", brand:"Infinix", price:"K1800" },
{ id:"googlepixel8a", name:"Google Pixel 8a", brand:"Google", price:"K6000" }
];

function load(listData){
let list = document.getElementById("list");
list.innerHTML = "";

listData.forEach(p=>{
list.innerHTML += `
<div class="card" onclick="openP('${p.id}')">
<img src="images/${p.id}.jpg">
<h4>${p.name}</h4>
<p class="price">${p.price}</p>
</div>
`;
});
}

function filter(type){
if(type === "all"){
load(phones);
}else{
let filtered = phones.filter(p => p.brand === type);
load(filtered);
}
}

function openP(id){
location.href = "product.html?id=" + id;
}

/* LOAD ALL ON START */
load(phones);

</script>
<a class="whatsapp-float" href="https://wa.me/260974674732">
💬 WhatsApp Us
</a>
</body>
</html>
