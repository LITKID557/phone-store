<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZamTech Mobile Store</title>

<title>Product - ZamTech Mobile Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

/* TOP BAR */
header{
background:#0f0f0f;
color:white;
padding:10px;
text-align:center;
}

/* CONTAINER */
.container{
padding:15px;
background:white;
}

/* IMAGE */
img{
width:100%;
max-height:300px;
object-fit:cover;
border-radius:10px;
}

/* TEXT */
h2{margin:10px 0;}
.price{
color:green;
font-size:20px;
font-weight:bold;
}

/* BOX */
.box{
background:#f9f9f9;
padding:10px;
border-radius:10px;
margin-top:10px;
}

/* BUTTON */
button{
width:100%;
padding:12px;
border:none;
border-radius:8px;
background:#25D366;
color:white;
font-size:16px;
cursor:pointer;
margin-top:10px;
}

/* BACK */
.back{
display:inline-block;
margin:10px;
color:white;
text-decoration:none;
}
</style>
</head>

<body>

<header>
<a class="back" href="shop.html">⬅ Back</a>
📱 Product Details
</header>

<div class="container" id="product"></div>

<script>
