<!DOCTYPE html>
<html>
<head>
  <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZamTech Mobile Store</title>
<title>ZamTech Mobile Store</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f4f4f4;
}

/* HEADER */
header{
background:#0f0f0f;
color:white;
padding:15px;
text-align:center;
}

.logo{
font-size:22px;
font-weight:bold;
}

.tag{
font-size:12px;
opacity:0.7;
}

/* HERO */
.hero{
background:white;
padding:15px;
text-align:center;
}

.hero input{
width:90%;
padding:12px;
border-radius:8px;
border:1px solid #ccc;
}

/* BUTTON */
button{
width:100%;
padding:10px;
border:none;
border-radius:8px;
background:#25D366;
color:white;
font-size:14px;
margin-top:5px;
}

/* GRID */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:10px;
padding:10px;
}

.card{
background:white;
border-radius:10px;
padding:8px;
box-shadow:0 0 6px rgba(0,0,0,0.1);
}

.card img{
width:100%;
height:120px;
object-fit:cover;
border-radius:8px;
}

.price{
color:green;
font-weight:bold;
}

/* SECTION */
.section{
padding:10px;
font-weight:bold;
}

/* FLOAT BUTTON */
.float{
position:fixed;
bottom:15px;
right:15px;
background:#25D366;
color:white;
padding:12px;
border-radius:50px;
text-decoration:none;
font-weight:bold;
}
@media(max-width:500px){
h2{font-size:16px;}
h4{font-size:14px;}
.price{font-size:13px;}
}
</style>
</head>

<body>

<header>
<div class="logo">📱 ZamTech Mobile Store</div>
<div class="tag">Trusted Used & New Phones in Zambia</div>
</header>

<!-- SEARCH -->
<div class="hero">
<input id="search" placeholder="Search iPhone, Samsung, Tecno...">
<br>
<button class="btn" onclick="go()">Search Phones</button>
</div>

<!-- FEATURED -->
<div class="section">⭐ Featured Deals</div>

<div class="grid">

<div class="card">
<img src="images/iphonex.jpg">
<p>iPhone X</p>
<p class="price">K3500</p>
</div>

<div class="card">
<img src="images/samsunga32.jpg">
<p>Samsung A32</p>
<p class="price">K2300</p>
</div>

<div class="card">
<img src="images/googlepixel7.jpg">
<p>Google Pixel 7</p>
<p class="price">K4500</p>
</div>

</div>

<a class="float" href="https://wa.me/260974674732">💬 WhatsApp Us</a>

<script>
function go(){
let q=document.getElementById("search").value;
location.href="shop.html?search="+q;
}
</script>

</body>
</html>
